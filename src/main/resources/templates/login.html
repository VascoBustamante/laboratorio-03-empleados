<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 15px;
        }

        .logout {
            color: green;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>Iniciar Sesión</h1>

    <div th:if="${param.error}" class="error">
        Usuario o contraseña incorrectos.
    </div>

    <div th:if="${param.logout}" class="logout">
        Sesión cerrada correctamente.
    </div>

    <form th:action="@{/login}" method="post">

        <label>Usuario:</label>
        <input type="text"
               name="username"
               required>

        <label>Contraseña:</label>
        <input type="password"
               name="password"
               required>

        <button type="submit">
            Ingresar
        </button>

    </form>

</div>

</body>
</html>
