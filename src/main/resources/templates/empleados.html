<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Empleados</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .nuevo {
            display: inline-block;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #333;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .editar {
            display: inline-block;
            padding: 7px 12px;
            background-color: #ffc107;
            color: black;
            text-decoration: none;
            border-radius: 4px;
            margin-right: 5px;
        }

        .eliminar {
            display: inline-block;
            padding: 7px 12px;
            background-color: #dc3545;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Gestión de Empleados</h1>

    <a th:href="@{/empleados/nuevo}" class="nuevo">
        Nuevo Empleado
    </a>

    <table>

        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Teléfono</th>
            <th>Cargo</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="empleado : ${empleados}">

            <td th:text="${empleado.id}"></td>

            <td th:text="${empleado.nombre}"></td>

            <td th:text="${empleado.email}"></td>

            <td th:text="${empleado.rol}"></td>

            <td th:text="${empleado.telefono}"></td>

            <td th:text="${empleado.cargo}"></td>

            <td>

                <a th:href="@{/empleados/editar/{id}(id=${empleado.id})}"
                   class="editar">
                    Editar
                </a>

                <a th:href="@{/empleados/eliminar/{id}(id=${empleado.id})}"
                   class="eliminar"
                   onclick="return confirm('¿Está seguro de eliminar este empleado?');">
                    Eliminar
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
