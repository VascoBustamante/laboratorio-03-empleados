<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Formulario de Empleado</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            width: 450px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h1 th:text="${empleado.id == null} ? 'Nuevo Empleado' : 'Editar Empleado'">
        Empleado
    </h1>

    <form th:action="@{/empleados/guardar}"
          th:object="${empleado}"
          method="post">

        <!-- ID oculto para edición -->
        <input type="hidden" th:field="*{id}">

        <label>Nombre:</label>
        <input type="text"
               th:field="*{nombre}"
               required>

        <label>Email:</label>
        <input type="email"
               th:field="*{email}"
               required>

        <label>Rol:</label>
        <select th:field="*{rol}" required>
            <option value="">Seleccione un rol</option>
            <option value="admin">Admin</option>
            <option value="usuario">Usuario</option>
        </select>

        <label>Teléfono:</label>
        <input type="text"
               th:field="*{telefono}"
               required>

        <label>Cargo:</label>
        <input type="text"
               th:field="*{cargo}"
               required>

        <button type="submit">
            Guardar
        </button>

    </form>

    <a th:href="@{/empleados}" class="volver">
        Volver
    </a>

</div>

</body>
</html>
